[package]
name = "kira-bam"
description = "High-performance BAM/SAM/CRAM toolkit written in Rust 2024. Drop-in samtools-compatible CLI (view/sort/index/merge/markdup/flagstat) plus a library API for embedding directly into aligners and variant callers."
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ARyaskov/kira-bam"
keywords = [
    "bioinformatics",
    "genomics",
    "bam",
    "sam",
    "samtools"
]
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::sequence-analysis",
    "command-line-utilities",
    "algorithms"
]

[lib]
name = "kira_bam"
path = "src/lib.rs"

[[bin]]
name = "kira-bam"
path = "src/bin/kira_bam.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
tempfile = "3.27.0"
same-file = "1.0.6"
bstr = "1.14.0"
# Total-RAM detection for `--memory auto` (dynamic sort buffer sized to a
# fraction of available memory). Lightweight; just the system module is
# needed.
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
# mmap for SAM input — when the aligner→sort handoff goes through a tmp SAM
# file, mmap'ing it is measurably faster than buffered reads. On gzip-
# compressed BAM we still pay decompression, but the kernel I/O path is one
# syscall instead of N read() calls.
memmap2 = "0.9.12"

# Keep the noodles crates on compatible versions to share alignment and BGZF types.
noodles-bam = "0.98.0"
noodles-sam = "0.93.0"
noodles-bgzf = { version = "0.52.0", features = ["libdeflate"] }
noodles-csi = "0.62.0"
noodles-core = "0.21.0"
noodles-fasta = "0.68.0"
noodles-cram = "0.102.0"

[dev-dependencies]
# Property testing — used to prove the AVX2 quality-sum matches the scalar
# reference across the full u8 domain (including the 0xFF missing-qual sentinel).
proptest = "1.12.0"

[features]
default = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
lto = "thin"
codegen-units = 1
